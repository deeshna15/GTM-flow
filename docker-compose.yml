services:
  postgres:
    image: postgres:16-alpine
    container_name: gtmflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gtmflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtmflow_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-gtmflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gtmflow} -d ${POSTGRES_DB:-gtmflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gtmflow_network

  redis:
    image: redis:7-alpine
    container_name: gtmflow_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gtmflow_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gtmflow_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-gtmflow}:${POSTGRES_PASSWORD:-gtmflow_secret_password}@postgres:5432/${POSTGRES_DB:-gtmflow}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-gtmflow_super_secret_development_key_minimum_32_characters_long}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-gtmflow_jwt_secret_development_key_minimum_32_characters_long}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - gtmflow_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gtmflow_celery_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-gtmflow}:${POSTGRES_PASSWORD:-gtmflow_secret_password}@postgres:5432/${POSTGRES_DB:-gtmflow}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-gtmflow_super_secret_development_key_minimum_32_characters_long}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-gtmflow_jwt_secret_development_key_minimum_32_characters_long}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - gtmflow_network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gtmflow_celery_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    depends_on:
      celery_worker:
        condition: service_started
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-gtmflow}:${POSTGRES_PASSWORD:-gtmflow_secret_password}@postgres:5432/${POSTGRES_DB:-gtmflow}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-gtmflow_super_secret_development_key_minimum_32_characters_long}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-gtmflow_jwt_secret_development_key_minimum_32_characters_long}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
    networks:
      - gtmflow_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: gtmflow_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - gtmflow_network

networks:
  gtmflow_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
